apiVersion: v1
kind: ConfigMap
metadata:
  name: chance-movie-bot-config
  namespace: chance-movie-bot
  labels:
    app.kubernetes.io/name: chance-movie-bot
    app.kubernetes.io/component: config
data:
  MIN_RATING: "7.0"
  MIN_VOTES: "150"
  DEFAULT_LANGUAGE: "uk"
  MAX_DISCOVERY_PAGES: "15"
  SEEN_MOVIES_BUFFER_SIZE: "50"
  DISCOVER_CACHE_TTL: "1200"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_FILE: ""

